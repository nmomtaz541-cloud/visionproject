<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ai Robotics Academy | Ultimate ERP 2026</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.0/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* نظام الألوان المتعددة */
        :root {
            --primary: #6366f1;
            --secondary: #ec4899;
            --accent: #8b5cf6;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --info: #0ea5e9;
            --dark: #0f172a;
            --sidebar: #1e293b;
            --bg-light: #f8fafc;
            --glass: rgba(255, 255, 255, 0.9);
            --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        /* تنسيق عام متحرك */
        * { transition: all 0.25s ease; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            margin: 0;
            display: flex;
            min-height: 100vh;
        }

        /* --- Sidebar الملون --- */
        .sidebar {
            width: 280px;
            background: linear-gradient(180deg, var(--sidebar) 0%, #0f172a 100%);
            color: white;
            padding: 2rem 1rem;
            position: fixed;
            height: 100vh;
            right: 0;
            z-index: 1000;
            box-shadow: -10px 0 30px rgba(0,0,0,0.3);
        }

        .logo-box {
            background: white;
            padding: 15px;
            border-radius: 20px;
            margin-bottom: 2rem;
            text-align: center;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
        }

        .logo-box img { width: 80px; height: 80px; border-radius: 15px; }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 14px 20px;
            color: #94a3b8;
            text-decoration: none;
            border-radius: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .nav-link:hover {
            background: rgba(255,255,255,0.05);
            color: white;
            transform: translateX(-10px);
        }

        .nav-link.active {
            background: linear-gradient(90deg, var(--primary), var(--accent));
            color: white;
            box-shadow: 0 10px 15px rgba(99, 102, 241, 0.3);
        }

        /* --- محرك البحث المتقدم (4 أنواع) --- */
        .search-engine {
            background: var(--glass);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 25px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            box-shadow: var(--shadow);
            border: 1px solid white;
        }

        .search-field { display: flex; flex-direction: column; gap: 8px; }
        .search-field label { font-size: 0.8rem; font-weight: 800; color: var(--primary); }
        .search-field input, .search-field select {
            padding: 10px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            outline: none;
        }
        .search-field input:focus { border-color: var(--secondary); }

        /* --- Main Content --- */
        .main-content {
            margin-right: 280px;
            padding: 30px;
            width: 100%;
        }

        /* بطاقات الإحصائيات الملونة */
        .stats-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-item {
            padding: 25px;
            border-radius: 24px;
            color: white;
            position: relative;
            overflow: hidden;
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
        }

        .s-in { background: linear-gradient(135deg, #059669, #10b981); }
        .s-out { background: linear-gradient(135deg, #dc2626, #f87171); }
        .s-net { background: linear-gradient(135deg, #4f46e5, #818cf8); }
        .s-count { background: linear-gradient(135deg, #d97706, #fbbf24); }

        .stat-item i {
            position: absolute;
            left: -10px;
            bottom: -10px;
            font-size: 5rem;
            opacity: 0.2;
        }

        /* --- النموذج التفاعلي --- */
        .entry-form {
            background: white;
            padding: 30px;
            border-radius: 24px;
            box-shadow: var(--shadow);
            margin-bottom: 30px;
            border-top: 5px solid var(--primary);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
        }

        .btn-gradient {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.4);
        }

        .btn-gradient:hover { transform: scale(1.05); box-shadow: 0 15px 25px rgba(99, 102, 241, 0.5); }

        /* --- الجدول الملون --- */
        .table-container {
            background: white;
            border-radius: 24px;
            padding: 20px;
            box-shadow: var(--shadow);
        }

        table { width: 100%; border-collapse: collapse; }
        th { padding: 20px; text-align: right; background: #f8fafc; color: var(--sidebar); border-radius: 10px; }
        td { padding: 20px; border-bottom: 1px solid #f1f5f9; }

        .status-pill {
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .paid { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .partial { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
        .late { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }

        .action-btn {
            width: 40px; height: 40px; border-radius: 10px;
            border: none; cursor: pointer; margin-left: 5px;
        }
        .b-print { background: #e0f2fe; color: var(--info); }
        .b-del { background: #fee2e2; color: var(--danger); }

        /* الشارات الملونة للنوع */
        .type-student { border-right: 5px solid var(--success); }
        .type-staff { border-right: 5px solid var(--danger); }

        @media (max-width: 1100px) {
            .search-engine { grid-template-columns: 1fr 1fr; }
            .stats-container { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="logo-box">
            <img src="Screenshot 2026-01-29 114906.png" alt="Logo">
            <h3 style="color: var(--dark); margin: 10px 0 0;">AI Academy</h3>
        </div>
        
        <nav>
            <div class="nav-link active"><i class="fas fa-home"></i> الرئيسية</div>
            <div class="nav-link" onclick="filterByMonth()"><i class="fas fa-chart-bar"></i> تقرير الشهر الحالي</div>
            <div class="nav-link" onclick="exportData()"><i class="fas fa-file-excel"></i> تصدير Excel</div>
            <div class="nav-link" onclick="saveBackup()"><i class="fas fa-database"></i> نسخة احتياطية</div>
            <div class="nav-link" onclick="document.getElementById('fileIn').click()"><i class="fas fa-cloud-upload-alt"></i> استيراد بيانات</div>
            <input type="file" id="fileIn" style="display:none" onchange="importData(event)">
        </nav>

        <div style="margin-top: auto; padding: 20px; border-radius: 15px; background: rgba(255,255,255,0.1);">
            <p style="margin:0; font-size: 0.8rem;">إجمالي السيولة:</p>
            <h2 id="sideNet" style="margin:5px 0 0; color: var(--success);">0</h2>
        </div>
    </aside>

    <main class="main-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <div>
                <h1 style="margin:0; color: var(--dark);">نظام إدارة الأكاديمية الذكي</h1>
                <p id="liveDate" style="color: var(--primary); font-weight: bold;"></p>
            </div>
            <div style="display: flex; gap: 15px;">
                <button class="btn-gradient" style="background: var(--info)" onclick="window.print()">
                    <i class="fas fa-print"></i> طباعة التقارير
                </button>
            </div>
        </div>

        <div class="stats-container">
            <div class="stat-item s-in">
                <i class="fas fa-hand-holding-usd"></i>
                <span>إجمالي المدخول</span>
                <h2 id="totalIn">0</h2>
            </div>
            <div class="stat-item s-out">
                <i class="fas fa-file-invoice-dollar"></i>
                <span>إجمالي المصاريف</span>
                <h2 id="totalOut">0</h2>
            </div>
            <div class="stat-item s-net">
                <i class="fas fa-wallet"></i>
                <span>صافي الأرباح</span>
                <h2 id="netTotal">0</h2>
            </div>
            <div class="stat-item s-count">
                <i class="fas fa-users"></i>
                <span>عدد المعاملات</span>
                <h2 id="opCount">0</h2>
            </div>
        </div>

        <section class="search-engine">
            <div class="search-field">
                <label>1. البحث بالاسم</label>
                <input type="text" id="sName" placeholder="اكتب اسماً..." onkeyup="render()">
            </div>
            <div class="search-field">
                <label>2. البحث بالتصنيف</label>
                <select id="sCat" onchange="render()">
                    <option value="all">كل التصنيفات</option>
                    <option value="اشتراك شهري">اشتراكات الطلاب</option>
                    <option value="كورس برمجة">كورسات</option>
                    <option value="راتب موظف">رواتب</option>
                    <option value="إيجار">إيجارات</option>
                    <option value="نثريات">نثريات</option>
                </select>
            </div>
            <div class="search-field">
                <label>3. البحث بالحالة</label>
                <select id="sStatus" onchange="render()">
                    <option value="all">كل الحالات</option>
                    <option value="paid">تم الدفع ✅</option>
                    <option value="partial">دفع جزئي ⏳</option>
                    <option value="late">متأخر ❌</option>
                </select>
            </div>
            <div class="search-field">
                <label>4. الترتيب الزمني</label>
                <select id="sDate" onchange="render()">
                    <option value="new">الأحدث أولاً</option>
                    <option value="old">الأقدم أولاً</option>
                </select>
            </div>
        </section>

        <section class="entry-form">
            <h3 style="margin-top:0; color: var(--primary);"><i class="fas fa-plus-circle"></i> إضافة معاملة مالية جديدة</h3>
            <div class="form-grid">
                <div class="search-field">
                    <label>نوع الجهة</label>
                    <select id="fType" onchange="updateSubCats()">
                        <option value="student">طالب (إيراد)</option>
                        <option value="staff">موظف/مورد (مصروف)</option>
                    </select>
                </div>
                <div class="search-field">
                    <label>الاسم بالكامل</label>
                    <input type="text" id="fName" placeholder="مثال: أحمد محمد">
                </div>
                <div class="search-field">
                    <label>البند</label>
                    <select id="fSub"></select>
                </div>
                <div class="search-field">
                    <label>القيمة الأساسية</label>
                    <input type="number" id="fPrice" placeholder="0.00" oninput="calculateFinal()">
                </div>
                <div class="search-field f-disc">
                    <label>خصم %</label>
                    <input type="number" id="fDisc" value="0" oninput="calculateFinal()">
                </div>
                <div class="search-field">
                    <label>الصافي</label>
                    <input type="number" id="fFinal" readonly style="background: #f1f5f9; font-weight: bold;">
                </div>
                <div class="search-field">
                    <label>الحالة</label>
                    <select id="fStatus">
                        <option value="paid">مدفوع بالكامل ✅</option>
                        <option value="partial">دفع جزئي ⏳</option>
                        <option value="late">مستحق لاحقاً ❌</option>
                    </select>
                </div>
                <button class="btn-gradient" onclick="saveRecord()">حفظ المعاملة</button>
            </div>
        </section>

        <div class="table-container">
            <h3 style="margin-top:0"><i class="fas fa-history"></i> سجل العمليات المالي</h3>
            <table>
                <thead>
                    <tr>
                        <th>التاريخ</th>
                        <th>الاسم والجهة</th>
                        <th>البند</th>
                        <th>المبلغ</th>
                        <th>الحالة</th>
                        <th>خيارات</th>
                    </tr>
                </thead>
                <tbody id="mainTableBody"></tbody>
            </table>
        </div>
    </main>

    <script>
        let database = JSON.parse(localStorage.getItem('ai_robotic_2026_pro')) || [];

        // تحديث التاريخ
        document.getElementById('liveDate').innerText = new Date().toLocaleDateString('ar-EG', {
            weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
        });

        function updateSubCats() {
            const type = document.getElementById('fType').value;
            const sub = document.getElementById('fSub');
            const discField = document.querySelector('.f-disc');
            
            if(type === 'student') {
                sub.innerHTML = `
                    <option value="اشتراك شهري">اشتراك شهري</option>
                    <option value="كورس برمجة">كورس برمجة</option>
                    <option value="ورشة روبوتات">ورشة عمل</option>
                `;
                discField.style.display = 'flex';
            } else {
                sub.innerHTML = `
                    <option value="راتب موظف">راتب شهري</option>
                    <option value="إيجار">إيجار المقر</option>
                    <option value="نثريات">فواتير ونثريات</option>
                `;
                discField.style.display = 'none';
                document.getElementById('fDisc').value = 0;
            }
            calculateFinal();
        }

        function calculateFinal() {
            const p = parseFloat(document.getElementById('fPrice').value) || 0;
            const d = parseFloat(document.getElementById('fDisc').value) || 0;
            document.getElementById('fFinal').value = (p - (p * d / 100)).toFixed(2);
        }

        function saveRecord() {
            const name = document.getElementById('fName').value;
            const final = parseFloat(document.getElementById('fFinal').value);
            
            if(!name || final <= 0) return alert("يرجى ملء كافة البيانات");

            const record = {
                id: Date.now(),
                name: name,
                type: document.getElementById('fType').value,
                sub: document.getElementById('fSub').value,
                amount: final,
                status: document.getElementById('fStatus').value,
                date: new Date().toISOString(),
                dateStr: new Date().toLocaleDateString('ar-EG')
            };

            database.unshift(record);
            localStorage.setItem('ai_robotic_2026_pro', JSON.stringify(database));
            render();
            resetForm();
        }

        function resetForm() {
            document.getElementById('fName').value = '';
            document.getElementById('fPrice').value = '';
            document.getElementById('fDisc').value = 0;
            calculateFinal();
        }

        function render() {
            const body = document.getElementById('mainTableBody');
            const sName = document.getElementById('sName').value.toLowerCase();
            const sCat = document.getElementById('sCat').value;
            const sStatus = document.getElementById('sStatus').value;
            const sDate = document.getElementById('sDate').value;

            let filtered = database.filter(i => {
                const matchName = i.name.toLowerCase().includes(sName);
                const matchCat = sCat === 'all' || i.sub === sCat;
                const matchStatus = sStatus === 'all' || i.status === sStatus;
                return matchName && matchCat && matchStatus;
            });

            if(sDate === 'old') filtered.reverse();

            let tIn = 0, tOut = 0;
            let html = '';

            filtered.forEach(item => {
                if(item.type === 'student') tIn += item.amount; else tOut += item.amount;

                html += `
                    <tr class="${item.type === 'student' ? 'type-student' : 'type-staff'}">
                        <td style="font-size:0.8rem">${item.dateStr}</td>
                        <td><strong>${item.name}</strong><br><small style="color:#94a3b8">${item.type === 'student' ? 'طالب' : 'مصروف'}</small></td>
                        <td>${item.sub}</td>
                        <td style="font-weight:bold; color:${item.type === 'student' ? 'var(--success)' : 'var(--danger)'}">
                            ${item.amount.toLocaleString()} ج.م
                        </td>
                        <td><span class="status-pill ${item.status}">${getStatusText(item.status)}</span></td>
                        <td>
                            <button class="action-btn b-print" onclick="printOne(${item.id})"><i class="fas fa-print"></i></button>
                            <button class="action-btn b-del" onclick="deleteRec(${item.id})"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });

            body.innerHTML = html || '<tr><td colspan="6" style="text-align:center">لا يوجد بيانات</td></tr>';
            updateStats(tIn, tOut);
        }

        function getStatusText(s) {
            return s === 'paid' ? 'مدفوع' : s === 'partial' ? 'جزئي' : 'متأخر';
        }

        function updateStats(tin, tout) {
            document.getElementById('totalIn').innerText = tin.toLocaleString() + ' ج.م';
            document.getElementById('totalOut').innerText = tout.toLocaleString() + ' ج.م';
            document.getElementById('netTotal').innerText = (tin - tout).toLocaleString() + ' ج.م';
            document.getElementById('sideNet').innerText = (tin - tout).toLocaleString() + ' ج.م';
            document.getElementById('opCount').innerText = database.length;
        }

        function deleteRec(id) {
            if(confirm("حذف هذه المعاملة؟")) {
                database = database.filter(i => i.id !== id);
                localStorage.setItem('ai_robotic_2026_pro', JSON.stringify(database));
                render();
            }
        }

        function exportData() {
            const ws = XLSX.utils.json_to_sheet(database);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Financial_Report");
            XLSX.writeFile(wb, "Academy_Report_2026.xlsx");
        }

        function saveBackup() {
            const blob = new Blob([JSON.stringify(database)], {type: "application/json"});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "backup_ai_academy.json";
            a.click();
        }

        function importData(e) {
            const reader = new FileReader();
            reader.onload = function(ev) {
                database = JSON.parse(ev.target.result);
                localStorage.setItem('ai_robotic_2026_pro', JSON.stringify(database));
                render();
                alert("تم استيراد البيانات بنجاح");
            };
            reader.readAsText(e.target.files[0]);
        }

        function printOne(id) {
            const item = database.find(i => i.id === id);
            const win = window.open('', '', 'width=600,height=600');
            win.document.write(`
                <div style="direction:rtl; font-family:sans-serif; border:5px double #6366f1; padding:30px; text-align:center;">
                    <h1 style="color:#6366f1">أكاديمية الذكاء الاصطناعي</h1>
                    <hr>
                    <h2>إيصال مالي</h2>
                    <div style="text-align:right; font-size:1.2rem;">
                        <p>تاريخ المعاملة: ${item.dateStr}</p>
                        <p>اسم العميل/الجهة: <b>${item.name}</b></p>
                        <p>البند: ${item.sub}</p>
                        <p style="background:#f1f5f9; padding:15px;">المبلغ الصافي: <b style="font-size:1.5rem; color:#10b981;">${item.amount} ج.م</b></p>
                        <p>الحالة: ${getStatusText(item.status)}</p>
                    </div>
                    <p style="margin-top:50px; opacity:0.5">شكراً لتعاملكم معنا - نظام Elite ERP</p>
                </div>
            `);
            win.print();
        }

        function filterByMonth() {
            const now = new Date();
            database = database.filter(i => {
                const d = new Date(i.date);
                return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
            });
            render();
        }

        // البداية
        updateSubCats();
        render();
    </script>
</body>
</html>
